    <style>
        /* ═══════════════════════════════════════════
           REDESIGNED CSS — PREMIUM DARK-FIRST
           Palet: Deep charcoal + warm coral/amber
           ═══════════════════════════════════════════ */
        :root {
            --bg-body: #0b0b10;
            --bg-gradient: radial-gradient(ellipse 120% 60% at 50% -10%, #1a0f0a, transparent 60%),
                           radial-gradient(ellipse 80% 50% at 80% 100%, #0a0f1a, transparent 50%),
                           #0b0b10;
            --surface: rgba(255, 255, 255, 0.028);
            --surface-hover: rgba(255, 255, 255, 0.055);
            --surface-elevated: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --border-glow: rgba(232, 85, 61, 0.35);

            --primary: #e8553d;
            --primary-dark: #c94430;
            --primary-light: rgba(232, 85, 61, 0.12);
            --accent: #f0a030;
            --accent-glow: rgba(240, 160, 48, 0.25);

            --text-main: #e8e4df;
            --text-secondary: #b0aaa3;
            --text-muted: #6b6560;
            --text-faint: #3d3835;

            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-lg: 0 16px 48px -12px rgba(0,0,0,0.5);
            --shadow-glass: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
            --input-bg: rgba(255, 255, 255, 0.03);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 28px;
        }

        /* LIGHT MODE — Warm cream tones */
        body.dark-mode {
            --bg-body: #f5f0ea;
            --bg-gradient: radial-gradient(ellipse 120% 60% at 50% -10%, #fff3eb, transparent 60%),
                           radial-gradient(ellipse 80% 50% at 80% 100%, #ebf0ff, transparent 50%),
                           #f5f0ea;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-hover: rgba(255, 255, 255, 0.9);
            --surface-elevated: rgba(255, 255, 255, 0.8);
            --border: rgba(0, 0, 0, 0.06);
            --border-hover: rgba(0, 0, 0, 0.12);
            --border-glow: rgba(232, 85, 61, 0.3);

            --primary: #d04a34;
            --primary-dark: #b83d2a;
            --primary-light: rgba(232, 85, 61, 0.08);
            --accent: #d49020;

            --text-main: #1a1512;
            --text-secondary: #5c5650;
            --text-muted: #8a837c;
            --text-faint: #c5bfb8;

            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-lg: 0 16px 48px -12px rgba(0,0,0,0.08);
            --shadow-glass: 0 8px 32px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.8);
            --input-bg: rgba(0, 0, 0, 0.03);
        }

        /* ── RESET & BASE ── */
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--bg-body);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            padding: 0 20px 80px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.3s ease;
        }

        /* ── AMBIENT BACKGROUND ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 {
            top: -20%; right: -15%; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(232,85,61,0.15), transparent 70%);
            animation: orbDrift1 25s ease-in-out infinite alternate;
        }
        .orb-2 {
            bottom: -15%; left: -10%; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(240,160,48,0.1), transparent 70%);
            animation: orbDrift2 30s ease-in-out infinite alternate;
        }
        /* Noise overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px;
        }

        @keyframes orbDrift1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-40px, 60px) scale(1.15); }
        }
        @keyframes orbDrift2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -40px) scale(1.1); }
        }

        /* ── LAYOUT ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── THEME TOGGLE ── */
        .theme-toggle {
            position: fixed;
            top: 24px; right: 24px;
            width: 42px; height: 42px;
            border-radius: 12px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            transform: translateY(-2px) scale(1.05);
            color: var(--primary);
            border-color: var(--border-glow);
            box-shadow: 0 0 20px var(--border-glow);
        }

        /* ── HEADER ── */
        header {
            text-align: center;
            padding-top: 64px;
            margin-bottom: 32px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 50px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid rgba(232,85,61,0.15);
        }
        .header-badge i { font-size: 0.65rem; }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 14px;
            color: var(--text-main);
            transition: color 0.3s;
        }
        h1 span {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 400;
            max-width: 420px;
            margin: 0 auto 36px;
            line-height: 1.5;
        }

        /* ── CONTROLS WRAPPER ── */
        .controls-wrapper {
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 28px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-glass);
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, background 0.3s;
        }
        .controls-wrapper::before {
            content: "";
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232,85,61,0.3), transparent);
        }

        .controls-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        .controls-top:last-child { border-bottom: none; padding-bottom: 0; }

        /* ── GENDER RADIO ── */
        .gender-group {
            display: flex;
            background: var(--input-bg);
            border-radius: 50px;
            padding: 3px;
            border: 1px solid var(--border);
            position: relative;
        }

        .gender-radio { display: none; }

        .gender-label {
            padding: 9px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.25s ease;
            position: relative;
            z-index: 1;
        }
        .gender-label:hover { color: var(--text-secondary); }

        .gender-radio:checked + .gender-label {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 12px var(--border-glow);
        }

        /* ── NUMBER INPUT ── */
        .input-wrapper { position: relative; }

        .input-wrapper i {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.85rem;
        }

        input[type="number"] {
            padding: 11px 20px 11px 40px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            border-radius: 50px;
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 600;
            outline: none;
            width: 150px;
            transition: all 0.25s;
            font-family: 'Outfit', sans-serif;
        }
        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            background: var(--surface-hover);
        }
        input[type="number"]::-webkit-inner-spin-button { opacity: 0.3; }

        /* ── REGION SECTION ── */
        .region-section {
            width: 100%;
            text-align: center;
        }

        .region-label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .region-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            justify-content: center;
        }

        .region-tag {
            padding: 7px 14px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .region-tag:hover {
            border-color: var(--border-hover);
            color: var(--text-secondary);
            background: var(--surface-hover);
        }
        .region-tag.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 16px var(--border-glow);
        }

        .region-note {
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--text-faint);
            letter-spacing: 0.02em;
        }

        /* ── ACTION BUTTONS ── */
        .controls-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .separator { display: none; }

        .btn {
            padding: 11px 22px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.25s ease;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.01em;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 20px var(--border-glow);
            padding: 12px 28px;
            font-size: 0.9rem;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--border-glow);
            filter: brightness(1.1);
        }
        .btn-generate:active { transform: translateY(0); }

        .btn-action {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
        }
        .btn-action:hover {
            background: var(--surface-hover);
            color: var(--text-secondary);
            border-color: var(--border);
        }
        .btn-action.url-action:hover { color: var(--accent); }

        /* ── STATS TAGS ── */
        .tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 50px;
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .tag:hover { border-color: var(--border-hover); color: var(--text-secondary); }
        .tag i { color: var(--primary); font-size: 0.65rem; }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* ── CARD — PREMIUM REDESIGN ── */
        .card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            padding: 0;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-glass);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            animation: cardReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s, background 0.3s;
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 48px -12px rgba(0,0,0,0.35);
            border-color: var(--border-hover);
            background: var(--surface-hover);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover::before { opacity: 1; }

        .card .fields {
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ── FIELD ITEM ── */
        .field-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: transparent;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .field-item:hover {
            background: var(--surface-elevated);
            border-color: var(--border);
        }

        .f-content {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex: 1;
            cursor: pointer;
            min-width: 0;
        }

        .f-icon {
            width: 18px;
            text-align: center;
            color: var(--text-faint);
            font-size: 0.8rem;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .field-item:hover .f-icon { color: var(--primary); }

        .f-text {
            font-size: 0.88rem;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s;
        }
        .field-item:hover .f-text { color: var(--text-main); }

        .f-text.name { font-weight: 700; color: var(--text-main); font-size: 0.95rem; }
        .f-text.user { color: var(--text-main); font-weight: 600; }
        .f-text.email { color: var(--text-muted); font-size: 0.82rem; }

        .name-group {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }
        .name-part {
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 5px;
            transition: background 0.15s, color 0.15s;
            display: inline-block;
        }
        .name-part:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .separator-name {
            color: var(--text-faint);
            font-weight: 300;
            pointer-events: none;
        }

        .copy-small {
            width: 26px; height: 26px;
            border: none;
            background: transparent;
            color: var(--text-faint);
            cursor: pointer;
            opacity: 0;
            transform: translateX(6px);
            transition: all 0.2s;
            flex-shrink: 0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }
        .field-item:hover .copy-small {
            opacity: 1;
            transform: translateX(0);
        }
        .copy-small:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--text-main);
            color: var(--bg-body);
            padding: 11px 22px;
            border-radius: 50px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i { color: var(--primary); }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            body { padding: 0 14px 60px; }
            header { padding-top: 48px; }
            .controls-wrapper {
                padding: 20px 16px;
                border-radius: var(--radius-lg);
            }
            .controls-top {
                flex-direction: column;
                width: 100%;
            }
            .input-wrapper, .gender-group, .btn {
                width: 100%;
                justify-content: center;
            }
            input[type="number"] { width: 100%; text-align: center; }
            .grid { grid-template-columns: 1fr; gap: 14px; }
            .card .fields { padding: 18px 16px; }
            .copy-small { opacity: 1; transform: translateX(0); }
            .theme-toggle { top: 16px; right: 16px; width: 38px; height: 38px; }
            h1 { font-size: 1.8rem; }
        }

        @media (max-width: 400px) {
            .controls-actions { gap: 6px; }
            .btn { padding: 10px 14px; font-size: 0.8rem; }
            .region-tag { padding: 6px 10px; font-size: 0.75rem; }
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--text-faint);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ── SELECTION ── */
        ::selection {
            background: var(--primary);
            color: #fff;

        let generatedUsernames = new Set();
        let currentUsernameList = [];
        let currentEmailList = [];
        let currentUrlList = [];

        // Initialize Region Tags
        const regionKeys = Object.keys(nameData);
        const activeRegions = new Set(["English"]); // Default

        function initRegionTags() {
            const container = document.getElementById('regionTags');
            regionKeys.forEach(region => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'region-tag' + (region === 'English' ? ' active' : '');
                btn.textContent = region;
                
                btn.addEventListener('click', () => {
                    if (activeRegions.has(region)) {
                        // Prevent deselecting the last one
                        if (activeRegions.size === 1) return;
                        activeRegions.delete(region);
                        btn.classList.remove('active');
                    } else {
                        activeRegions.add(region);
                        btn.classList.add('active');
                    }
                });
                container.appendChild(btn);
            });
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        function generateData() {
            const amountInput = document.getElementById('amount');
            let amount = parseInt(amountInput.value) || 5;
            if(amount > 100) amount = 100;
            if(amount < 1) amount = 1;

            // Get selected gender
            const genderRadios = document.getElementsByName('gender');
            let selectedGender = 'all';
            for (const radio of genderRadios) {
                if (radio.checked) {
                    selectedGender = radio.value;
                    break;
                }
            }

            const grid = document.getElementById('cardGrid');
            const counter = document.getElementById('counterDisplay');
            
            grid.innerHTML = ""; 
            generatedUsernames.clear();
            currentUsernameList = []; 
            currentEmailList = [];
            currentUrlList = [];

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < amount; i++) {
                let first = "";
                let last = "";
                
                // 1. Pick a Random Region from Active Set
                const regionArray = Array.from(activeRegions);
                const randomRegion = regionArray[Math.floor(Math.random() * regionArray.length)];
                const data = nameData[randomRegion];

                // 2. Gender Logic
                if (selectedGender === 'male') {
                    first = data.male[Math.floor(Math.random() * data.male.length)];
                } else if (selectedGender === 'female') {
                    first = data.female[Math.floor(Math.random() * data.female.length)];
                } else {
                    const isMale = Math.random() > 0.5;
                    if (isMale) {
                        first = data.male[Math.floor(Math.random() * data.male.length)];
                    } else {
                        first = data.female[Math.floor(Math.random() * data.female.length)];
                    }
                }
                
                last = data.last[Math.floor(Math.random() * data.last.length)];
                const fullName = `${first} ${last}`;
                
                // Emoji list (not used in UI but kept for logic consistency)
                const avatarEmojis = ["🦊", "🦁", "🐯", "🐸", "🦄", "🐙", "🦋", "🐞"];
                const emoji = avatarEmojis[Math.floor(Math.random() * avatarEmojis.length)];
                
                let username = "";
                let isUnique = false;
                
                while (!isUnique) {
                    const style = Math.floor(Math.random() * 5); 
                    const randomNum = Math.floor(Math.random() * 99999);

                    switch(style) {
                        case 0: username = (first + last + "2026").toLowerCase(); break;
                        case 1: username = (first + "." + last + randomNum).toLowerCase(); break;
                        case 2: username = (first + last + randomNum).toLowerCase(); break;
                        case 3: username = (first + "_" + last + randomNum).toLowerCase(); break;
                        case 4: username = (first + randomNum + last).toLowerCase(); break;
                    }

                    if (!generatedUsernames.has(username)) {
                        generatedUsernames.add(username);
                        isUnique = true;
                    }
                }

                const email = `${username}@Greysyaa.io`
                const profileUrl = `https://mail.n2n.io/m/${username}`;
                const password = "n2n@" + first + Math.floor(Math.random() * 9000 + 1000) + "!";

                currentUsernameList.push(username);
                currentEmailList.push(email);
                currentUrlList.push(profileUrl);

                // Create Card
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${i * 0.07}s`;
                
                card.innerHTML = `
                    <div class="fields">
                        <div class="field-item">
                            <div class="f-content" onclick="copyText('${fullName.replace(/'/g, "\\'")}')">
                                <i class="fa-solid fa-user f-icon"></i>
                                <div class="name-group">
                                    <span class="name-part" onclick="event.stopPropagation(); copyText('${first.replace(/'/g, "\\'")}')">${first}</span>
                                    <span class="separator-name">·</span>
                                    <span class="name-part" onclick="event.stopPropagation(); copyText('${last.replace(/'/g, "\\'")}')">${last}</span>
                                </div>
                            </div>
                            <button class="copy-small" onclick="copyText('${fullName.replace(/'/g, "\\'")}')"><i class="fa-regular fa-copy"></i></button>
                        </div>
                        <div class="field-item">
                            <div class="f-content" onclick="copyText('${username}')">
                                <i class="fa-regular fa-user"></i>
                                <span class="f-text user">@${username}</span>
                            </div>
                            <button class="copy-small" onclick="copyText('${username}')"><i class="fa-regular fa-copy"></i></button>
                        </div>
                        <div class="field-item">
                            <div class="f-content" onclick="copyText('${email}')">
                                <i class="fa-solid fa-envelope"></i>
                                <span class="f-text email">${email}</span>
                            </div>
                            <button class="copy-small" onclick="copyText('${email}')"><i class="fa-regular fa-copy"></i></button>
                        </div>
                        <div class="field-item">
                            <div class="f-content" onclick="copyText('${password.replace(/'/g, "\\'")}')">
                                <i class="fa-solid fa-key"></i>
                                <span class="f-text email">${password}</span>
                            </div>
                            <button class="copy-small" onclick="copyText('${password.replace(/'/g, "\\'")}')"><i class="fa-regular fa-copy"></i></button>
                        </div>
                    </div>
                `;

                fragment.appendChild(card);
            }

            grid.appendChild(fragment);
            counter.innerHTML = `<i class="fa-solid fa-bolt"></i> ${amount} Generated`;
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied: ${text}`);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.querySelector('span').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyAllUsernames() {
            if(currentUsernameList.length === 0) return;
            navigator.clipboard.writeText(currentUsernameList.join('\n')).then(() => {
                showToast(`${currentUsernameList.length} Usernames Copied!`);
            });
        }

        function copyAllEmails() {
            if(currentEmailList.length === 0) return;
            navigator.clipboard.writeText(currentEmailList.join('\n')).then(() => {
                showToast(`${currentEmailList.length} Emails Copied!`);
            });
        }

        function copyAllUrls() {
            if(currentUrlList.length === 0) return;
            navigator.clipboard.writeText(currentUrlList.join('\n')).then(() => {
                showToast(`${currentUrlList.length} URLs Copied!`);
            });
        }

        // Initialize
        initRegionTags();
        generateData();
    </script>
