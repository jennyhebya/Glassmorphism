<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NameForge V2 — Random Identity Generator</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22none%22 stroke=%22%23e8553d%22 stroke-width=%224%22/><text x=%2250%22 y=%2262%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23e8553d%22 font-family=%22sans-serif%22 font-weight=%22bold%22>N</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #08080c;
            --bg-sub: #0e0e14;
            --surface: rgba(255,255,255,0.03);
            --surface-2: rgba(255,255,255,0.055);
            --surface-3: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.06);
            --border-h: rgba(255,255,255,0.13);
            --primary: #e8553d;
            --primary-d: #c74430;
            --primary-g: rgba(232,85,61,0.25);
            --accent: #f0a030;
            --accent-g: rgba(240,160,48,0.18);
            --green: #34d399;
            --green-g: rgba(52,211,153,0.15);
            --blue: #60a5fa;
            --purple: #c084fc;
            --t1: #ededea;
            --t2: #a8a49e;
            --t3: #5e5a55;
            --t4: #2e2b28;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Space Grotesk', sans-serif;
            --r: 14px;
            --r-lg: 20px;
            --r-full: 999px;
        }
        body.light {
            --bg: #f2ede7;
            --bg-sub: #e8e2db;
            --surface: rgba(255,255,255,0.65);
            --surface-2: rgba(255,255,255,0.85);
            --surface-3: rgba(255,255,255,0.95);
            --border: rgba(0,0,0,0.07);
            --border-h: rgba(0,0,0,0.14);
            --primary: #d04a34;
            --primary-d: #b83d2a;
            --primary-g: rgba(208,74,52,0.2);
            --accent-g: rgba(200,140,20,0.12);
            --green-g: rgba(16,160,100,0.1);
            --t1: #141210;
            --t2: #5a5550;
            --t3: #908a84;
            --t4: #c8c2bb;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
        body{
            font-family:var(--sans);background:var(--bg);color:var(--t1);
            min-height:100vh;overflow-x:hidden;
            transition:background .45s,color .3s;
        }

        /* ── Ambient ── */
        .amb{position:fixed;border-radius:50%;filter:blur(130px);z-index:0;pointer-events:none}
        .amb-a{top:-18%;right:-12%;width:550px;height:550px;background:radial-gradient(circle,rgba(232,85,61,.13),transparent 70%);animation:ad1 22s ease-in-out infinite alternate}
        .amb-b{bottom:-14%;left:-8%;width:480px;height:480px;background:radial-gradient(circle,rgba(240,160,48,.09),transparent 70%);animation:ad2 28s ease-in-out infinite alternate}
        .amb-c{top:40%;left:50%;width:300px;height:300px;background:radial-gradient(circle,rgba(52,211,153,.06),transparent 70%);animation:ad3 18s ease-in-out infinite alternate}
        @keyframes ad1{to{transform:translate(-35px,50px) scale(1.12)}}
        @keyframes ad2{to{transform:translate(40px,-35px) scale(1.08)}}
        @keyframes ad3{to{transform:translate(-60px,30px) scale(1.15)}}

        body::after{
            content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.018;
            background-image:url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h1v1H0z' fill='%23fff'/%3E%3C/svg%3E");
            background-size:40px 40px;
        }

        /* ── Top Bar ── */
        .topbar{
            position:sticky;top:0;z-index:100;
            display:flex;align-items:center;justify-content:space-between;
            padding:14px 24px;
            background:rgba(8,8,12,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);
            transition:background .3s;
        }
        body.light .topbar{background:rgba(242,237,231,.78)}
        .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.3px}
        .logo-icon{
            width:32px;height:32px;border-radius:9px;
            background:linear-gradient(135deg,var(--primary),var(--accent));
            display:flex;align-items:center;justify-content:center;
            color:#fff;font-size:.85rem;font-weight:800;
        }
        .logo-ver{font-size:.65rem;font-weight:500;color:var(--t3);margin-left:2px;letter-spacing:.04em}
        .topbar-actions{display:flex;align-items:center;gap:8px}
        .tb-btn{
            width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
            background:var(--surface);color:var(--t3);cursor:pointer;
            display:flex;align-items:center;justify-content:center;font-size:.85rem;
            transition:all .2s;
        }
        .tb-btn:hover{color:var(--t1);border-color:var(--border-h);background:var(--surface-2);transform:translateY(-1px)}

        /* ── Main Container ── */
        .wrap{max-width:1280px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:1}

        /* ── Hero ── */
        .hero{text-align:center;margin-bottom:36px;padding-top:16px}
        .hero h1{font-size:clamp(2rem,4.5vw,2.8rem);font-weight:700;letter-spacing:-1.2px;line-height:1.12;margin-bottom:10px}
        .hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero p{color:var(--t3);font-size:.95rem;max-width:440px;margin:0 auto;line-height:1.55}

        /* ── Control Panel ── */
        .cpanel{
            background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border:1px solid var(--border);border-radius:var(--r-lg);
            padding:24px 28px;margin:0 auto 32px;
            max-width:720px;
            position:relative;overflow:hidden;
            text-align:center;
            transition:border-color .3s,background .3s;
        }
        .cpanel::before{
            content:"";position:absolute;top:0;left:15%;right:15%;height:1px;
            background:linear-gradient(90deg,transparent,var(--primary-g),transparent);
        }
        .crow{
            display:flex;flex-wrap:wrap;align-items:center;
            justify-content:center;
            gap:12px;margin-bottom:18px;
        }
        .crow:last-child{margin-bottom:0}
        .crow-label{
            font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;
            color:var(--t3);font-weight:600;width:100%;margin-bottom:2px;
            text-align:center;
        }

        /* Gender pills */
        .gpills{display:flex;background:var(--surface-2);border-radius:var(--r-full);padding:3px;border:1px solid var(--border)}
        .gr{display:none}
        .gl{
            padding:8px 18px;border-radius:var(--r-full);cursor:pointer;
            font-size:.82rem;font-weight:600;color:var(--t3);
            transition:all .22s;position:relative;z-index:1;
        }
        .gl:hover{color:var(--t2)}
        .gr:checked+.gl{background:var(--primary);color:#fff;box-shadow:0 2px 10px var(--primary-g)}

        /* Number input */
        .numwrap{position:relative}
        .numwrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t4);font-size:.78rem;pointer-events:none}
        .numwrap input{
            padding:9px 16px 9px 36px;border:1px solid var(--border);background:var(--surface-2);
            border-radius:var(--r-full);font-size:.9rem;color:var(--t1);font-weight:600;
            outline:none;width:130px;font-family:var(--sans);transition:all .22s;
            text-align:center;
        }
        .numwrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-g)}

        /* Region tags */
        .rtags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
        .rtag{
            padding:6px 13px;border-radius:var(--r-full);border:1px solid var(--border);
            background:var(--surface-2);color:var(--t3);font-size:.76rem;font-weight:600;
            cursor:pointer;transition:all .18s;user-select:none;
        }
        .rtag:hover{border-color:var(--border-h);color:var(--t2);background:var(--surface-3)}
        .rtag.on{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 3px 12px var(--primary-g)}

        /* Buttons */
        .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
        .btn{
            padding:10px 20px;border-radius:var(--r-full);font-size:.82rem;font-weight:600;
            cursor:pointer;border:none;display:inline-flex;align-items:center;gap:7px;
            font-family:var(--sans);transition:all .22s;letter-spacing:.01em;
        }
        .btn-gen{
            background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;
            box-shadow:0 4px 18px var(--primary-g);padding:11px 26px;font-size:.88rem;
        }
        .btn-gen:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--primary-g);filter:brightness(1.08)}
        .btn-gen:active{transform:translateY(0)}
        .btn-sec{background:transparent;color:var(--t3);border:1px solid transparent}
        .btn-sec:hover{background:var(--surface-2);color:var(--t2);border-color:var(--border)}
        .btn-sec.link:hover{color:var(--accent)}
        .btn-sec.mail:hover{color:var(--green)}
        .btn-sec.user:hover{color:var(--blue)}

        /* ── Stats Strip ── */
        .stats{display:flex;justify-content:center;gap:20px;margin-bottom:36px;flex-wrap:wrap}
        .stat{
            display:flex;align-items:center;gap:7px;
            font-size:.75rem;color:var(--t3);font-weight:500;
        }
        .stat i{font-size:.7rem}
        .stat .ic-r{color:var(--primary)}
        .stat .ic-g{color:var(--green)}
        .stat .ic-a{color:var(--accent)}
        .stat .ic-b{color:var(--blue)}

        /* ── Grid ── */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}

        /* ── Card V2 ── */
        .card{
            background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
            border:1px solid var(--border);border-radius:var(--r-lg);
            overflow:hidden;position:relative;
            opacity:0;transform:translateY(20px) scale(.98);
            animation:cr .5s cubic-bezier(.22,1,.36,1) forwards;
            transition:border-color .3s,box-shadow .3s,transform .3s,background .3s;
        }
        @keyframes cr{to{opacity:1;transform:translateY(0) scale(1)}}
        .card:hover{
            transform:translateY(-3px);
            box-shadow:0 20px 44px -10px rgba(0,0,0,.3);
            border-color:var(--border-h);background:var(--surface-2);
        }
        .card::after{
            content:"";position:absolute;top:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg,var(--primary),var(--accent),var(--green));
            opacity:0;transition:opacity .3s;
        }
        .card:hover::after{opacity:1}

        .card-head{
            display:flex;align-items:center;gap:14px;
            padding:20px 22px 0;
        }
        .avatar{
            width:44px;height:44px;border-radius:12px;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            font-size:.95rem;font-weight:700;color:#fff;
            position:relative;overflow:hidden;
        }
        .avatar::after{
            content:"";position:absolute;inset:0;
            background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
        }
        .card-head-text{min-width:0;flex:1}
        .card-name{
            font-size:1rem;font-weight:700;color:var(--t1);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
            cursor:pointer;padding:2px 0;transition:color .2s;
        }
        .card-name:hover{color:var(--primary)}
        .card-region{
            font-size:.7rem;color:var(--t3);font-weight:500;
            display:flex;align-items:center;gap:5px;margin-top:2px;
        }
        .card-region i{font-size:.6rem;color:var(--accent)}
        .card-num{
            font-size:.68rem;color:var(--t4);font-weight:600;
            font-family:var(--mono);flex-shrink:0;
        }

        .card-fields{padding:14px 22px 20px;display:flex;flex-direction:column;gap:2px}
        .cf{
            display:flex;align-items:center;gap:10px;
            padding:8px 10px;border-radius:10px;
            transition:background .15s;position:relative;
        }
        .cf:hover{background:var(--surface-2)}
        .cf-icon{
            width:28px;height:28px;border-radius:8px;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            font-size:.7rem;transition:all .2s;
        }
        .cf-icon.ic-user{background:rgba(96,165,250,.1);color:var(--blue)}
        .cf-icon.ic-mail{background:var(--green-g);color:var(--green)}
        .cf-icon.ic-link{background:var(--accent-g);color:var(--accent)}
        .cf-icon.ic-lock{background:rgba(192,132,252,.1);color:var(--purple)}
        .cf:hover .cf-icon{transform:scale(1.08)}
        .cf-text{
            flex:1;min-width:0;font-size:.82rem;color:var(--t2);font-weight:500;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
            cursor:pointer;transition:color .2s;
            font-family:var(--mono);letter-spacing:-.2px;
        }
        .cf:hover .cf-text{color:var(--t1)}
        .cf-copy{
            width:26px;height:26px;border:none;background:transparent;
            color:var(--t4);cursor:pointer;opacity:0;transform:translateX(5px);
            transition:all .18s;flex-shrink:0;border-radius:7px;
            display:flex;align-items:center;justify-content:center;font-size:.7rem;
        }
        .cf:hover .cf-copy{opacity:1;transform:translateX(0)}
        .cf-copy:hover{color:var(--primary);background:rgba(232,85,61,.1)}

        /* ── Toast ── */
        .toast{
            position:fixed;bottom:28px;left:50%;
            transform:translateX(-50%) translateY(14px);
            background:var(--t1);color:var(--bg);
            padding:10px 20px;border-radius:var(--r-full);
            box-shadow:0 10px 28px rgba(0,0,0,.3);
            font-size:.82rem;font-weight:500;z-index:2000;
            opacity:0;pointer-events:none;
            transition:all .35s cubic-bezier(.175,.885,.32,1.275);
            display:flex;align-items:center;gap:8px;
        }
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        .toast i{color:var(--primary)}

        /* ── Empty State ── */
        .empty{text-align:center;padding:80px 20px;color:var(--t3)}
        .empty i{font-size:2.5rem;margin-bottom:16px;display:block;color:var(--t4)}
        .empty p{font-size:.95rem;font-weight:500}
        .empty span{font-size:.8rem;color:var(--t4);margin-top:6px;display:block}

        /* ── Responsive ── */
        @media(max-width:768px){
            .wrap{padding:20px 14px 60px}
            .hero{padding-top:8px}
            .hero h1{font-size:1.7rem}
            .cpanel{padding:18px 16px;border-radius:var(--r);max-width:100%}
            .crow{flex-direction:column;width:100%}
            .numwrap,.numwrap input{width:100%}
            .btns{width:100%}
            .btns .btn{flex:1;justify-content:center;min-width:0}
            .grid{grid-template-columns:1fr;gap:12px}
            .cf-copy{opacity:1;transform:translateX(0)}
            .stats{gap:12px}
            .topbar{padding:12px 16px}
        }
        @media(max-width:400px){
            .btn{padding:9px 12px;font-size:.76rem;gap:5px}
            .rtag{padding:5px 9px;font-size:.7rem}
            .card-head{padding:16px 16px 0}
            .card-fields{padding:10px 16px 16px}
        }

        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--t4);border-radius:10px}
        ::-webkit-scrollbar-thumb:hover{background:var(--t3)}
        ::selection{background:var(--primary);color:#fff}

        @media(prefers-reduced-motion:reduce){
            *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
        }
    </style>
</head>
<body>

<div class="amb amb-a"></div>
<div class="amb amb-b"></div>
<div class="amb amb-c"></div>

<nav class="topbar">
    <div class="logo">
        <div class="logo-icon">N</div>
        NameForge <span class="logo-ver">V2</span>
    </div>
    <div class="topbar-actions">
        <button class="tb-btn" onclick="toggleTheme()" title="Ganti Tema" id="themeBtn">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>
</nav>

<div class="wrap">
    <section class="hero">
        <h1>Random <em>Name Generator</em></h1>
        <p>Generate profil identitas digital realistis dari 12 negara dalam satu klik.</p>
    </section>

    <div class="cpanel">
        <div class="crow">
            <span class="crow-label">Gender & Jumlah</span>
            <div class="gpills">
                <input type="radio" id="g-all" name="gender" value="all" class="gr" checked>
                <label for="g-all" class="gl">Semua</label>
                <input type="radio" id="g-male" name="gender" value="male" class="gr">
                <label for="g-male" class="gl">Pria</label>
                <input type="radio" id="g-female" name="gender" value="female" class="gr">
                <label for="g-female" class="gl">Wanita</label>
            </div>
            <div class="numwrap">
                <i class="fa-solid fa-hashtag"></i>
                <input type="number" id="amount" value="5" min="1" max="5000">
            </div>
        </div>

        <div class="crow">
            <span class="crow-label">Region / Negara Asal</span>
            <div class="rtags" id="regionTags"></div>
        </div>

        <div class="crow" style="margin-bottom:0">
            <span class="crow-label">Aksi</span>
            <div class="btns">
                <button class="btn btn-gen" onclick="generateData()">
                    <i class="fa-solid fa-bolt"></i> Generate
                </button>
                <button class="btn btn-sec user" onclick="copyAllUsernames()">
                    <i class="fa-solid fa-at"></i> Usernames
                </button>
                <button class="btn btn-sec mail" onclick="copyAllEmails()">
                    <i class="fa-solid fa-envelope"></i> Emails
                </button>
                <button class="btn btn-sec link" onclick="copyAllUrls()">
                    <i class="fa-solid fa-link"></i> URLs
                </button>
            </div>
        </div>
    </div>

    <div class="stats">
        <div class="stat"><i class="fa-solid fa-globe ic-r"></i> 12 Regions</div>
        <div class="stat"><i class="fa-solid fa-fingerprint ic-g"></i> Unique</div>
        <div class="stat"><i class="fa-solid fa-shield-halved ic-a"></i> Anti-Duplikat</div>
        <div class="stat" id="counterStat"><i class="fa-solid fa-circle-check ic-b"></i> Siap</div>
    </div>

    <main class="grid" id="cardGrid">
        <div class="empty" style="grid-column:1/-1">
            <i class="fa-solid fa-users"></i>
            <p>Belum ada data yang di-generate</p>
            <span>Klik tombol Generate untuk memulai</span>
        </div>
    </main>
</div>

<div id="toast" class="toast">
    <i class="fa-solid fa-circle-check"></i> <span>Copied!</span>
</div>

let selectedRegions = new Set(["English"]);
let generatedData = [];
let usedUsernames = new Set();
let usedEmails = new Set();

function initRegionTags() {
    const container = document.getElementById("regionTags");
    container.innerHTML = "";
    Object.keys(nameData).forEach(region => {
        const tag = document.createElement("div");
        tag.className = "rtag" + (selectedRegions.has(region) ? " on" : "");
        tag.textContent = region;
        tag.onclick = () => {
            if (selectedRegions.has(region)) {
                if (selectedRegions.size > 1) {
                    selectedRegions.delete(region);
                    tag.classList.remove("on");
                }
            } else {
                selectedRegions.add(region);
                tag.classList.add("on");
            }
        };
        container.appendChild(tag);
    });
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function genUsername(first, last) {
    const f = first.toLowerCase().replace(/[^a-z]/g, "");
    const l = last.toLowerCase().replace(/[^a-z]/g, "");
    const patterns = [
        () => f + l + Math.floor(Math.random() * 999),
        () => f + "." + l + Math.floor(Math.random() * 99),
        () => f + "_" + l + Math.floor(Math.random() * 999),
        () => f + Math.floor(Math.random() * 9999),
        () => l + "." + f + Math.floor(Math.random() * 99),
        () => f + l.substring(0, 3) + Math.floor(Math.random() * 999),
    ];
    for (let i = 0; i < 20; i++) {
        const u = pick(patterns)();
        if (!usedUsernames.has(u)) { usedUsernames.add(u); return u; }
    }
    const fallback = f + l + Math.floor(Math.random() * 99999);
    usedUsernames.add(fallback);
    return fallback;
}

function genEmail(username) {
    const domains = ["gmail.com","yahoo.com","outlook.com","proton.me","mail.n2n.io","icloud.com","hotmail.com","fastmail.com"];
    const d = pick(domains);
    const e = username + "@" + d;
    if (!usedEmails.has(e)) { usedEmails.add(e); return e; }
    const e2 = username + Math.floor(Math.random()*99) + "@" + d;
    usedEmails.add(e2);
    return e2;
}

function genPassword() {
    const lower = "abcdefghijkmnopqrstuvwxyz";
    const upper = "ABCDEFGHJKLMNPQRSTUVWXYZ";
    const num = "23456789";
    const sym = "!@#$%&*?";
    const all = lower + upper + num + sym;
    let pw = "";
    pw += lower[Math.floor(Math.random()*lower.length)];
    pw += upper[Math.floor(Math.random()*upper.length)];
    pw += num[Math.floor(Math.random()*num.length)];
    pw += sym[Math.floor(Math.random()*sym.length)];
    for (let i = 4; i < 14; i++) pw += all[Math.floor(Math.random()*all.length)];
    return pw.split("").sort(() => Math.random() - 0.5).join("");
}

function generateData() {
    const genderVal = document.querySelector('input[name="gender"]:checked').value;
    let count = parseInt(document.getElementById("amount").value) || 5;
    count = Math.max(1, Math.min(50, count));

    usedUsernames.clear();
    usedEmails.clear();
    generatedData = [];

    const regionArr = Array.from(selectedRegions);

    for (let i = 0; i < count; i++) {
        const region = pick(regionArr);
        const rd = nameData[region];

        let gender;
        if (genderVal === "all") {
            gender = Math.random() > 0.5 ? "male" : "female";
        } else {
            gender = genderVal;
        }

        const first = pick(rd[gender]);
        const last = pick(rd.last);
        const username = genUsername(first, last);
        const email = genEmail(username);
        const password = genPassword();
        const url = "https://mail.n2n.io/m/" + username + ".mail.n2n.io";

        generatedData.push({ first, last, gender, region, username, email, password, url });
    }

    renderCards();
    updateCounter();
}

function renderCards() {
    const grid = document.getElementById("cardGrid");
    if (generatedData.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
            <i class="fa-solid fa-users"></i>
            <p>Belum ada data yang di-generate</p>
            <span>Klik tombol Generate untuk memulai</span>
        </div>`;
        return;
    }

    grid.innerHTML = generatedData.map((d, i) => {
        const initials = (d.first[0] + d.last[0]).toUpperCase();
        const color = avatarColors[i % avatarColors.length];
        const flag = regionFlags[d.region] || "";
        const delay = i * 0.06;

        return `
        <article class="card" style="animation-delay:${delay}s" aria-label="Kartu identitas ${d.first} ${d.last}">
            <div class="card-head">
                <div class="avatar" style="background:${color}">${initials}</div>
                <div class="card-head-text">
                    <div class="card-name" onclick="copyText('${d.first} ${d.last}')" title="Klik untuk salin nama">${d.first} ${d.last}</div>
                    <div class="card-region"><i class="fa-solid fa-location-dot"></i> ${flag} ${d.region} &middot; ${d.gender === "male" ? "Pria" : "Wanita"}</div>
                </div>
                <div class="card-num">#${String(i + 1).padStart(2, "0")}</div>
            </div>
            <div class="card-fields">
                <div class="cf">
                    <div class="cf-icon ic-user"><i class="fa-solid fa-at"></i></div>
                    <div class="cf-text" onclick="copyText('${d.username}')" title="Klik untuk salin">${d.username}</div>
                    <button class="cf-copy" onclick="copyText('${d.username}')" aria-label="Salin username"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="cf">
                    <div class="cf-icon ic-mail"><i class="fa-solid fa-envelope"></i></div>
                    <div class="cf-text" onclick="copyText('${d.email}')" title="Klik untuk salin">${d.email}</div>
                    <button class="cf-copy" onclick="copyText('${d.email}')" aria-label="Salin email"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="cf">
                    <div class="cf-icon ic-link"><i class="fa-solid fa-link"></i></div>
                    <div class="cf-text" onclick="copyText('${d.url}')" title="Klik untuk salin">${d.url}</div>
                    <button class="cf-copy" onclick="copyText('${d.url}')" aria-label="Salin URL"><i class="fa-regular fa-copy"></i></button>
                </div>
                <div class="cf">
                    <div class="cf-icon ic-lock"><i class="fa-solid fa-lock"></i></div>
                    <div class="cf-text" onclick="copyText('${d.password}')" title="Klik untuk salin">${d.password}</div>
                    <button class="cf-copy" onclick="copyText('${d.password}')" aria-label="Salin password"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
        </article>`;
    }).join("");
}

function updateCounter() {
    const el = document.getElementById("counterStat");
    const n = generatedData.length;
    el.innerHTML = `<i class="fa-solid fa-circle-check ic-b"></i> ${n} profil di-generate`;
}

function copyText(text) {
    navigator.clipboard.writeText(text).then(() => showToast("Tersalin: " + text.substring(0, 40) + (text.length > 40 ? "..." : "")));
}

function copyAllUsernames() {
    if (!generatedData.length) return showToast("Belum ada data!");
    const all = generatedData.map(d => d.username).join("\n");
    navigator.clipboard.writeText(all).then(() => showToast(generatedData.length + " username tersalin!"));
}

function copyAllEmails() {
    if (!generatedData.length) return showToast("Belum ada data!");
    const all = generatedData.map(d => d.email).join("\n");
    navigator.clipboard.writeText(all).then(() => showToast(generatedData.length + " email tersalin!"));
}

function copyAllUrls() {
    if (!generatedData.length) return showToast("Belum ada data!");
    const all = generatedData.map(d => d.url).join("\n");
    navigator.clipboard.writeText(all).then(() => showToast(generatedData.length + " URL tersalin!"));
}

let toastTimer;
function showToast(msg) {
    const t = document.getElementById("toast");
    t.querySelector("span").textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function toggleTheme() {
    const body = document.body;
    const icon = document.getElementById("themeIcon");
    body.classList.toggle("light");
    if (body.classList.contains("light")) {
        icon.className = "fa-solid fa-sun";
    } else {
        icon.className = "fa-solid fa-moon";
    }
}
