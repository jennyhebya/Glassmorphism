    <style>
        /* CSS VARIABLES - MODERN PALETTE */
        :root {
            /* Light Theme */
            --bg-body: #f8fafc;
            --bg-gradient: radial-gradient(circle at 50% 0%, #e0e7ff, #f8fafc);
            --surface: rgba(255, 255, 255, 0.65);
            --surface-hover: rgba(255, 255, 255, 0.85);
            --border: rgba(255, 255, 255, 0.6);
            --border-glow: rgba(99, 102, 241, 0.4);
            
            --primary: #6366f1; /* Indigo */
            --primary-dark: #4f46e5;
            --primary-light: #e0e7ff;
            --accent: #0ea5e9; /* Sky Blue */
            --accent-glow: rgba(14, 165, 233, 0.3);
            
            --text-main: #1e293b;
            --text-muted: #64748b;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            --input-bg: rgba(255, 255, 255, 0.5);
        }

        /* DARK MODE */
        body.dark-mode {
            --bg-body: #0f172a;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            --surface: rgba(30, 41, 59, 0.6);
            --surface-hover: rgba(51, 65, 85, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.3);
            
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --primary-light: rgba(129, 140, 248, 0.15);
            --accent: #38bdf8;
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --input-bg: rgba(0, 0, 0, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease, color 0.2s; }

        body {
            background-color: var(--bg-body);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            padding: 40px 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Background Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: floatOrb 20s infinite alternate;
        }
        .orb-1 { top: -10%; right: -10%; width: 500px; height: 500px; background: var(--primary); }
        .orb-2 { bottom: -10%; left: -10%; width: 400px; height: 400px; background: var(--accent); animation-delay: -5s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

        /* THEME TOGGLE */
        .theme-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 1.1rem;
            box-shadow: var(--shadow-sm);
        }
        .theme-toggle:hover { transform: translateY(-2px); color: var(--primary); border-color: var(--primary); }

        /* HEADER */
        header { text-align: center; margin-bottom: 40px; padding-top: 10px; }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        /* CONTROLS WRAPPER (Extended for Region Tags) */
        .controls-wrapper {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 24px; /* More rounded to accommodate layout */
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* Top Row: Gender & Count */
        .controls-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        .controls-top:last-child { border-bottom: none; padding-bottom: 0; }

        /* Gender Radio Group Styling */
        .gender-group {
            display: flex;
            background: var(--input-bg);
            border-radius: 50px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .gender-radio {
            display: none;
        }

        .gender-label {
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .gender-radio:checked + .gender-label {
            background: var(--surface-hover);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .gender-label:hover:not(.active) { color: var(--text-main); }

        .input-wrapper { position: relative; }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            opacity: 0.7;
        }

        input[type="number"] {
            padding: 12px 20px 12px 44px;
            border: 1px solid transparent;
            background: var(--input-bg);
            border-radius: 50px;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
            outline: none;
            width: 140px;
            transition: all 0.3s;
        }

        input[type="number"]:focus {
            background: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Region Tags Section */
        .region-section {
            width: 100%;
            text-align: center;
        }
        
        .region-label {
            display: block;
            margin-bottom: 12px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .region-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .region-tag {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .region-tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .region-tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px var(--border-glow);
        }

        .region-note {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* Action Buttons Row */
        .controls-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .separator {
            width: 1px;
            height: 24px;
            background-color: var(--border);
            display: none; /* Hidden in flex layout */
        }

        /* BUTTONS */
        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-generate {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px var(--border-glow);
        }
        .btn-generate:hover { transform: translateY(-2px); background: var(--primary-dark); box-shadow: 0 8px 20px var(--border-glow); }

        .btn-action {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
        }
        
        .btn-action:hover { 
            background: var(--surface-hover); 
            color: var(--primary); 
        }

        .btn-action.url-action:hover { color: var(--accent); }

        /* STATS TAGS */
        .tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 0.8rem;
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag i { color: var(--primary); font-size: 0.75rem; }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* CARD PREMIUM DESIGN */
        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-glass);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: cardEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
            border-color: var(--primary);
            background: var(--surface-hover);
        }

        /* Shiny Gradient Border on Hover */
        .card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            padding: 1px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0)); 
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); 
            -webkit-mask-composite: xor; 
            mask-composite: exclude; 
            pointer-events: none;
        }
        .card:hover::after {
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            opacity: 0.5;
        }

        /* Fields Layout */
        .fields {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .field-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--input-bg);
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .field-item:hover {
            background: var(--surface);
            border-color: var(--border);
            transform: translateX(4px);
        }

        .f-content {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            flex: 1;
            cursor: pointer; 
        }

        .f-icon {
            width: 20px;
            text-align: center;
            color: var(--text-muted); 
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .f-text {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Specific text styling */
        .f-text.name { font-weight: 700; }
        .f-text.user { color: var(--text-main); font-weight: 600; }
        .f-text.email { color: var(--text-muted); font-size: 0.85rem; }

        /* Split Name Styling inside field-item */
        .name-group {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        
        .name-part {
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: background 0.2s;
            display: inline-block;
        }

        .name-part:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .separator-name {
            color: var(--text-muted);
            font-weight: 400;
            pointer-events: none;
        }

        .copy-small {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .field-item:hover .copy-small {
            opacity: 1;
            transform: translateX(0);
        }
        
        .copy-small:hover { color: var(--primary); transform: scale(1.1); }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-main);
            color: var(--bg-body);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Responsive */
        @media (max-width: 768px) {
            .controls-wrapper {
                padding: 20px;
                border-radius: 20px;
            }
            .controls-top {
                flex-direction: column;
                width: 100%;
            }
            .input-wrapper, .gender-group, .btn { width: 100%; justify-content: center; }
            input[type="number"] { width: 100%; text-align: center; }
            h1 { font-size: 2.2rem; }
            .copy-small { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>

                male: ["Minh","Duc","Hung","Tuan","Hieu","Quan","Bao","Khoa","Nam","Long","Phuc","Trung","Huy","Dung","Son","Nguyễn","Minh","Nghĩa","Phạm","Nhật","Quang","Tạ","Nam","Thanh","Nguyễn","Nhật","Hòa","Vũ","Bình","Minh","Chung","Hiếu","Nghĩa","Trang","Ðức","Khang","Bùi","Ðại","Dương","An","Thế","Sơn","Nguyễn","Trường","Kỳ","","Vũ","Anh","Quân","Vưu","Ðình","Phú","Huỳnh","Cao","Minh","Nghiêm","Thanh","Huy","Bạch","Công","Hào","Đàm","Vĩnh","Luân","Mạc","Minh","Huấn","Phan","Huy","Anh","Bùi","Thanh","Phi","Đỗ","Thanh","Hậu","","Mạc","Chí","Giang","Trịnh","Hoàng","Phát","Tôn","Ðức","Tuệ","Ân","Vĩnh","Luân","Hồ","Ðức","Thọ","Đặng","Gia","Huy","Lê","Viễn","Phương","Huỳnh","Ðình","Sang","Phạm","Hữu","Tài","Phùng","Minh","Thông","","Lâm","Hữu","Ðạt","Nguyễn","Triệu","Thái","Thái","Phước","An","Bùi","Trung","Dũng","Đặng","Thế","Hùng","Vĩnh","Tấn","Trương","Hồ","Nhật","Dũng","Trầm","Long","Vịnh","Uất","Hữu","Khanh","Nguyễn","Ðức","Siêu","","Tô","Hiếu","Nghĩa","Phó","Ðình","Phú","Nguyễn","Thế","Trung","Đặng","Anh","Khoa","Nguyễn","Hùng","Cường","Đỗ","Gia","Phúc","Hoàng","Minh","Tân","Vương","Vinh","Diệu","Phạm","Hữu","Lễ","Liễu","Ðông","Dương"],
                last: ["Nguyen","Tran","Le","Pham","Hoang","Vo","Do","Bui","Dang","Lam","Ngo","Duong","Ly","Ha","Truong","Dinh"]
            }
        };

        let generatedUsernames = new Set();
        let currentUsernameList = [];
        let currentEmailList = [];
        let currentUrlList = [];

        // Initialize Region Tags
        const regionKeys = Object.keys(nameData);
        const activeRegions = new Set(["English"]); // Default

        function initRegionTags() {
            const container = document.getElementById('regionTags');
            regionKeys.forEach(region => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'region-tag' + (region === 'English' ? ' active' : '');
                btn.textContent = region;
                
                btn.addEventListener('click', () => {
                    if (activeRegions.has(region)) {
                        // Prevent deselecting the last one
                        if (activeRegions.size === 1) return;
                        activeRegions.delete(region);
                        btn.classList.remove('active');
                    } else {
                        activeRegions.add(region);
                        btn.classList.add('active');
                    }
                });
                container.appendChild(btn);
            });
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        function generateData() {
            const amountInput = document.getElementById('amount');
            let amount = parseInt(amountInput.value) || 5;
            if(amount > 100) amount = 100;
            if(amount < 1) amount = 1;

            // Get selected gender
            const genderRadios = document.getElementsByName('gender');
            let selectedGender = 'all';
            for (const radio of genderRadios) {
                if (radio.checked) {
                    selectedGender = radio.value;
                    break;
                }
            }

            const grid = document.getElementById('cardGrid');
            const counter = document.getElementById('counterDisplay');
            
            grid.innerHTML = ""; 
            generatedUsernames.clear();
            currentUsernameList = []; 
            currentEmailList = [];
            currentUrlList = [];

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < amount; i++) {
                let first = "";
                let last = "";
                
                // 1. Pick a Random Region from Active Set
                const regionArray = Array.from(activeRegions);
                const randomRegion = regionArray[Math.floor(Math.random() * regionArray.length)];
                const data = nameData[randomRegion];

                // 2. Gender Logic
                if (selectedGender === 'male') {
                    first = data.male[Math.floor(Math.random() * data.male.length)];
                } else if (selectedGender === 'female') {
                    first = data.female[Math.floor(Math.random() * data.female.length)];
                } else {
                    const isMale = Math.random() > 0.5;
                    if (isMale) {
                        first = data.male[Math.floor(Math.random() * data.male.length)];
                    } else {
                        first = data.female[Math.floor(Math.random() * data.female.length)];
                    }
                }
                
                last = data.last[Math.floor(Math.random() * data.last.length)];
                const fullName = `${first} ${last}`;
                
                // Emoji list (not used in UI but kept for logic consistency)
                const avatarEmojis = ["🦊", "🦁", "🐯", "🐸", "🦄", "🐙", "🦋", "🐞"];
                const emoji = avatarEmojis[Math.floor(Math.random() * avatarEmojis.length)];
                
                let username = "";
                let isUnique = false;
                
                while (!isUnique) {
                    const style = Math.floor(Math.random() * 5); 
                    const randomNum = Math.floor(Math.random() * 99999);

                    switch(style) {
                        case 0: username = (first + last + "2026").toLowerCase(); break;
                        case 1: username = (first + "." + last + randomNum).toLowerCase(); break;
                        case 2: username = (first + last + randomNum).toLowerCase(); break;
                        case 3: username = (first + "_" + last + randomNum).toLowerCase(); break;
                        case 4: username = (first + randomNum + last).toLowerCase(); break;
                    }

                    if (!generatedUsernames.has(username)) {
                        generatedUsernames.add(username);
                        isUnique = true;
                    }
                }

                const email = `${username}@mail.n2n.io`;
                const url = `https://mail.n2n.io/m/${email}`;

                currentUsernameList.push(username);
                currentEmailList.push(email);
                currentUrlList.push(url);

                // Render Card
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${i * 0.06}s`;

                card.innerHTML = `
                    <div class="fields">
                        <!-- Full Name Field Item -->
                        <div class="field-item">
                            <div class="f-content" onclick="copyToClipboard('${fullName}')" title="Click to copy Full Name">
                                <i class="fa-brands fa-facebook f-icon"></i>
                                <div class="name-group">
                                    <span class="name-part" onclick="event.stopPropagation(); copyToClipboard('${first}')" title="Copy First Name">${first}</span>
                                    <span class="separator-name"> </span>
                                    <span class="name-part" onclick="event.stopPropagation(); copyToClipboard('${last}')" title="Copy Last Name">${last}</span>
                                </div>
                            </div>
                            <button class="copy-small" onclick="copyToClipboard('${fullName}')" title="Copy Full Name">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>

                        <!-- Username Field Item -->
                        <div class="field-item">
                            <div class="f-content" onclick="copyToClipboard('${username}')" title="Click to copy Username">
                                <i class="fa-brands fa-instagram f-icon"></i>
                                <span class="f-text user">@${username}</span>
                            </div>
                            <button class="copy-small" onclick="copyToClipboard('${username}')">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>

                        <!-- Email Field Item -->
                        <div class="field-item">
                            <div class="f-content" onclick="copyToClipboard('${email}')" title="Click to copy Email">
                                <i class="fa-regular fa-envelope f-icon"></i>
                                <span class="f-text email">${email}</span>
                            </div>
                            <button class="copy-small" onclick="copyToClipboard('${email}')">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            }
            
            grid.appendChild(fragment);
            counter.innerHTML = `<i class="fa-solid fa-check"></i> Generated: ${amount}`;
            
            // Button animation
            const genBtn = document.querySelector('.btn-generate');
            genBtn.innerHTML = `<i class="fa-solid fa-circle-check"></i> Done`;
            setTimeout(() => {
                genBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Generate`;
            }, 1200);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Disalin: ${text.substring(0, 18)}${text.length > 18 ? '...' : ''}`);
            }).catch(err => {
                showToast("Gagal menyalin");
            });
        }

        function copyAllUsernames() {
            if (currentUsernameList.length === 0) return showToast("Generate dulu!");
            navigator.clipboard.writeText(currentUsernameList.join('\n')).then(() => {
                showToast(`${currentUsernameList.length} Usernames Copied!`);
            });
        }

        function copyAllEmails() {
            if (currentEmailList.length === 0) return showToast("Generate dulu!");
            navigator.clipboard.writeText(currentEmailList.join('\n')).then(() => {
                showToast(`${currentEmailList.length} Emails Copied!`);
            });
        }

        function copyAllUrls() {
            if (currentUrlList.length === 0) return showToast("Generate dulu!");
            navigator.clipboard.writeText(currentUrlList.join('\n')).then(() => {
                showToast(`${currentUrlList.length} URLs Copied!`);
            });
        }

        function showToast(msg) {
            const t = document.querySelector('#toast');
            t.innerHTML = `<i class="fa-solid fa-check"></i> <span>${msg}</span>`;
            t.classList.add('show');
            
            if (t.timeoutId) clearTimeout(t.timeoutId);
            
            t.timeoutId = setTimeout(() => {
                t.classList.remove('show');
            }, 3000);
        }

        // Initialize
        window.onload = function() {
            initRegionTags();
            generateData();
        };
    </script>
</body>
</html>
